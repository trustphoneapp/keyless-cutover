name: K0 fresh WIF-1 deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: vars.KEYLESS_K0_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          audience: ${{ vars.GCP_WIF_AUDIENCE }}
          request_reason: keyless fresh-wif-1 run=${{ github.run_id }}

      - name: Read the reviewed release marker
        id: release
        shell: bash
        run: |
          set -euo pipefail
          release="$(tr -d '\r\n' < demo/release.txt)"
          [[ "$release" == wif-1 ]] || { echo "unexpected fresh WIF-1 marker" >&2; exit 1; }
          echo "value=$release" >> "$GITHUB_OUTPUT"

      - name: Deploy through WIF
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ vars.GCP_ALLOWED_SERVICE }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_CANARY_IMAGE }}
          suffix: ${{ steps.release.outputs.value }}
          env_vars: RELEASE=${{ steps.release.outputs.value }}
          env_vars_update_strategy: merge
