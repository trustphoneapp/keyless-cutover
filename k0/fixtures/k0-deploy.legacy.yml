name: K0 legacy baseline deploy

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy before cutover or force a fresh online check after disable
        required: true
        type: choice
        options: [deploy, auth-check]
      release:
        description: Revision suffix for a deploy operation
        required: true
        default: legacy-1
      emit_proof:
        description: Emit the reviewed ProofV2 artifact
        required: true
        default: false
        type: boolean
      migration_id:
        required: false
      challenge_id:
        required: false
      nonce:
        required: false
      issued_at:
        required: false
      expires_at:
        required: false

permissions:
  contents: read

concurrency:
  group: keyless-k0-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.KEYLESS_K0_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create exact-key proof
        if: inputs.emit_proof
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          KEYLESS_MIGRATION_ID: ${{ inputs.migration_id }}
          KEYLESS_CHALLENGE_ID: ${{ inputs.challenge_id }}
          KEYLESS_NONCE: ${{ inputs.nonce }}
          KEYLESS_ISSUED_AT: ${{ inputs.issued_at }}
          KEYLESS_EXPIRES_AT: ${{ inputs.expires_at }}
          KEYLESS_WORKFLOW_PATH: .github/workflows/k0-deploy.yml
          KEYLESS_ENVIRONMENT: production
        run: |
          KEYLESS_WORKFLOW_BLOB_SHA="$(git hash-object .github/workflows/k0-deploy.yml)" \
            node src/key-proof.mjs generate .keyless/proof.json

      - name: Upload proof only
        if: inputs.emit_proof
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keyless-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: .keyless/proof.json
          if-no-files-found: error
          retention-days: 1

      - name: Authenticate with the legacy key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          request_reason: keyless migration=${{ inputs.migration_id }} run=${{ github.run_id }}

      - name: Force a fresh online legacy authentication
        if: inputs.operation == 'auth-check'
        run: >-
          gcloud run services describe "${{ vars.GCP_ALLOWED_SERVICE }}"
          --project="${{ vars.GCP_PROJECT_ID }}"
          --region="${{ vars.GCP_REGION }}"

      - name: Deploy through the legacy key
        if: inputs.operation == 'deploy'
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ vars.GCP_ALLOWED_SERVICE }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_CANARY_IMAGE }}
          suffix: ${{ inputs.release }}
          env_vars: RELEASE=${{ inputs.release }}
          env_vars_update_strategy: merge
