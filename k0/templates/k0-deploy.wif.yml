name: K0 deploy

on:
  push:
    branches: [main]
    paths:
      - demo/release.txt
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: keyless-k0-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.KEYLESS_K0_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read the reviewed release marker
        id: release
        shell: bash
        run: |
          release="$(tr -d '\r\n' < demo/release.txt)"
          [[ "$release" =~ ^[a-z0-9][a-z0-9-]{0,19}$ ]] || exit 1
          echo "value=$release" >> "$GITHUB_OUTPUT"

      - name: Authenticate through WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          audience: ${{ vars.GCP_WIF_AUDIENCE }}
          request_reason: keyless migration=k0 run=${{ github.run_id }}

      - name: Fail if the forbidden event authenticated
        if: github.event_name != 'push'
        run: exit 1

      - name: Deploy through WIF
        if: github.event_name == 'push'
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ vars.GCP_ALLOWED_SERVICE }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_CANARY_IMAGE }}
          suffix: ${{ steps.release.outputs.value }}
          env_vars: RELEASE=${{ steps.release.outputs.value }}
          env_vars_update_strategy: merge
