name: K0 legacy baseline deploy

on:
  push:
    branches: [main, keyless-h3]
    paths:
      - demo/release.txt
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: keyless-k0-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.KEYLESS_K0_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read the reviewed release marker
        id: release
        shell: bash
        run: |
          release="$(tr -d '\r\n' < demo/release.txt)"
          [[ "$release" =~ ^[a-z0-9][a-z0-9-]{0,19}$ ]] || exit 1
          echo "value=$release" >> "$GITHUB_OUTPUT"

      - name: Authenticate through WIF
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          audience: ${{ vars.GCP_WIF_AUDIENCE }}
          request_reason: keyless migration=k0 run=${{ github.run_id }}
          token_format: access_token
          create_credentials_file: false
          export_environment_variables: false

      - name: Deploy through WIF
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.GCP_ALLOWED_SERVICE }}
          IMAGE: ${{ vars.GCP_CANARY_IMAGE }}
          RELEASE: ${{ steps.release.outputs.value }}
        run: |
          set -euo pipefail
          revision="${SERVICE}-${RELEASE}"
          payload="$(jq -n --arg rev "$revision" --arg img "$IMAGE" --arg rel "$RELEASE" \
            '{template:{revision:$rev,containers:[{image:$img,env:[{name:"RELEASE",value:$rel}],ports:[{name:"http1",containerPort:8080}],resources:{limits:{cpu:"1",memory:"256Mi"}}}]}}')"
          code="$(curl -sS -o /tmp/k0-deploy-response.json -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE}?updateMask=template" \
            -d "$payload")"
          test "$code" = 200
          for _ in $(seq 1 60); do
            state="$(curl -sS -H "Authorization: Bearer ${ACCESS_TOKEN}" \
              "https://run.googleapis.com/v2/projects/${PROJECT_ID}/locations/${REGION}/services/${SERVICE}/revisions/${revision}" \
              | jq -r '.conditions[]? | select(.type=="Ready") | .state')"
            test "$state" != "CONDITION_FAILED"
            if [ "$state" = "CONDITION_SUCCEEDED" ]; then exit 0; fi
            sleep 5
          done
          exit 1

  h3-wrong-ref:
    if: vars.KEYLESS_K0_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/keyless-h3'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Attempt WIF from the wrong ref
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          audience: ${{ vars.GCP_WIF_AUDIENCE }}
          request_reason: keyless hostile=H3 run=${{ github.run_id }}

      - name: Require H3 denial
        env:
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
        run: |
          test "$AUTH_OUTCOME" = failure
          jq -n --arg id H3 --arg outcome "$AUTH_OUTCOME" --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg event "$GITHUB_EVENT_NAME" --arg ref "$GITHUB_REF" --arg environment production \
            '{version:1,id:$id,outcome:$outcome,run_id:$run_id,run_attempt:$attempt,head_sha:$sha,workflow_ref:$workflow_ref,event:$event,ref:$ref,environment:$environment}' \
            > k0-H3.json

      - name: Upload H3 client evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keyless-h3-denial
          path: k0-H3.json
          if-no-files-found: error
          retention-days: 7

  h5-wrong-event:
    if: vars.KEYLESS_K0_ENABLED == 'true' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Attempt WIF from the wrong event
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          audience: ${{ vars.GCP_WIF_AUDIENCE }}
          request_reason: keyless hostile=H5 run=${{ github.run_id }}

      - name: Require H5 denial
        env:
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
        run: |
          test "$AUTH_OUTCOME" = failure
          jq -n --arg id H5 --arg outcome "$AUTH_OUTCOME" --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg event "$GITHUB_EVENT_NAME" --arg ref "$GITHUB_REF" --arg environment production \
            '{version:1,id:$id,outcome:$outcome,run_id:$run_id,run_attempt:$attempt,head_sha:$sha,workflow_ref:$workflow_ref,event:$event,ref:$ref,environment:$environment}' \
            > k0-H5.json

      - name: Upload H5 client evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keyless-h5-denial
          path: k0-H5.json
          if-no-files-found: error
          retention-days: 7

  h6-wrong-environment:
    if: vars.KEYLESS_K0_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.KEYLESS_K0_POST_DISABLE_PUSH != 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Attempt WIF from the wrong environment
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          audience: ${{ vars.GCP_WIF_AUDIENCE }}
          request_reason: keyless hostile=H6 run=${{ github.run_id }}

      - name: Require H6 denial
        env:
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
        run: |
          test "$AUTH_OUTCOME" = failure
          jq -n --arg id H6 --arg outcome "$AUTH_OUTCOME" --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg event "$GITHUB_EVENT_NAME" --arg ref "$GITHUB_REF" --arg environment staging \
            '{version:1,id:$id,outcome:$outcome,run_id:$run_id,run_attempt:$attempt,head_sha:$sha,workflow_ref:$workflow_ref,event:$event,ref:$ref,environment:$environment}' \
            > k0-H6.json

      - name: Upload H6 client evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keyless-h6-denial
          path: k0-H6.json
          if-no-files-found: error
          retention-days: 7

  h7-wrong-audience:
    if: vars.KEYLESS_K0_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.KEYLESS_K0_POST_DISABLE_PUSH != 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Attempt WIF with the wrong audience
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          audience: https://iam.googleapis.com/projects/0/locations/global/workloadIdentityPools/wrong/providers/wrong
          request_reason: keyless hostile=H7 run=${{ github.run_id }}

      - name: Require H7 denial
        env:
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
        run: |
          test "$AUTH_OUTCOME" = failure
          jq -n --arg id H7 --arg outcome "$AUTH_OUTCOME" --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg event "$GITHUB_EVENT_NAME" --arg ref "$GITHUB_REF" --arg environment production \
            --arg audience https://iam.googleapis.com/projects/0/locations/global/workloadIdentityPools/wrong/providers/wrong \
            '{version:1,id:$id,outcome:$outcome,run_id:$run_id,run_attempt:$attempt,head_sha:$sha,workflow_ref:$workflow_ref,event:$event,ref:$ref,environment:$environment,audience:$audience}' \
            > k0-H7.json

      - name: Upload H7 client evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keyless-h7-denial
          path: k0-H7.json
          if-no-files-found: error
          retention-days: 7

  h8-forbidden-resource:
    if: vars.KEYLESS_K0_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.KEYLESS_K0_POST_DISABLE_PUSH != 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Authenticate the valid identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          audience: ${{ vars.GCP_WIF_AUDIENCE }}
          request_reason: keyless hostile=H8 run=${{ github.run_id }}

      - name: Attempt to mutate the forbidden service
        id: forbidden
        continue-on-error: true
        run: >-
          gcloud run services update "${{ vars.GCP_FORBIDDEN_SERVICE }}"
          --project="${{ vars.GCP_PROJECT_ID }}"
          --region="${{ vars.GCP_REGION }}"
          --update-env-vars="KEYLESS_HOSTILE_ATTEMPT=${{ github.run_id }}"
          --quiet

      - name: Require H8 denial
        env:
          FORBIDDEN_OUTCOME: ${{ steps.forbidden.outcome }}
        run: |
          test "$FORBIDDEN_OUTCOME" = failure
          jq -n --arg id H8 --arg outcome "$FORBIDDEN_OUTCOME" --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg sha "$GITHUB_SHA" --arg workflow_ref "$GITHUB_WORKFLOW_REF" \
            --arg event "$GITHUB_EVENT_NAME" --arg ref "$GITHUB_REF" --arg environment production \
            --arg target "${{ vars.GCP_FORBIDDEN_SERVICE }}" \
            '{version:1,id:$id,outcome:$outcome,run_id:$run_id,run_attempt:$attempt,head_sha:$sha,workflow_ref:$workflow_ref,event:$event,ref:$ref,environment:$environment,target:$target}' \
            > k0-H8.json

      - name: Upload H8 client evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keyless-h8-denial
          path: k0-H8.json
          if-no-files-found: error
          retention-days: 7
