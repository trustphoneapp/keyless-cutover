name: K0 legacy baseline deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: vars.KEYLESS_K0_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read the reviewed release marker
        id: release
        shell: bash
        run: |
          release="$(tr -d '\r\n' < demo/release.txt)"
          [[ "$release" =~ ^[a-z0-9][a-z0-9-]{0,19}$ ]] || exit 1
          echo "value=$release" >> "$GITHUB_OUTPUT"

      - name: Authenticate with the legacy key
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          request_reason: keyless baseline run=${{ github.run_id }}

      - name: Deploy through the legacy key
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3.0.1
        with:
          service: ${{ vars.GCP_ALLOWED_SERVICE }}
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ vars.GCP_CANARY_IMAGE }}
          suffix: ${{ steps.release.outputs.value }}
          env_vars: RELEASE=${{ steps.release.outputs.value }}
          env_vars_update_strategy: merge
