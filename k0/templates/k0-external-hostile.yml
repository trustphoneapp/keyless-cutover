name: K0 external identity probe

on:
  push:
    branches: [main]
    paths:
      - demo/release.txt

permissions:
  contents: read
  id-token: write

jobs:
  external-identity:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Attempt WIF from an external repository identity
        id: auth
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          audience: ${{ vars.GCP_WIF_AUDIENCE }}
          request_reason: keyless hostile=external run=${{ github.run_id }}

      - name: Require external identity denial
        env:
          AUTH_OUTCOME: ${{ steps.auth.outcome }}
        run: test "$AUTH_OUTCOME" = failure
